 'uniform sampler2D tDiffuse;uniform vec2 dir;varying vec2 vUv;void main(){vec3 c=texture2D(tDiffuse,vUv).rgb*0.2270270;c+=texture2D(tDiffuse,vUv+dir*1.3846153).rgb*0.3162162;c+=texture2D(tDiffuse,vUv-dir*1.3846153).rgb*0.3162162;c+=texture2D(tDiffuse,vUv+dir*3.2307692).rgb*0.0702702;c+=texture2D(tDiffuse,vUv-dir*3.2307692).rgb*0.0702702;gl_FragColor=vec4(c,1.0);}');

const OSM={};

function osmQuery(key,part){
  const base=key==='c1'?C1_PTS.concat([C1_PTS[0]]):WG_OUT;
  const line=base.map(p=>p[0].toFixed(5)+','+p[1].toFixed(5)).join(',');

async function overpassFetch(q,onMsg,tmo){
  const ck='https://cache.local/osm-v1-'+q.length+'-'+[...q].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7);
  let cache=null;try{cache=await caches.open('shutoko-osm');const hit=await cache.match(ck);if(hit){onMsg('保存済みの地図データを読み込み中…');return await hit.json();}}catch(e){cache=null;}
  let lastErr=null;
  for(const ep of OVERPASS){
    try{onMsg('地図データをダウンロード中…（'+new URL(ep).host+'）');
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),tmo||150000);
      const r=await fetch(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl.signal});
      clearTimeout(to);if(!r.ok){lastErr=new Error('HTTP '+r.status);continue;}
      const txt=await r.text();const js=JSON.parse(txt);
      if(cache){try{await cache.put(ck,new Response(txt,{headers:{'Content-Type':'application/json'}}));}catch(e){}}
      return js;
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('overpass');
}

        player.heroWheels=wh;player.wheels=[];
        player.mesh.userData.body=heroBody;
        const tb=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.05,0.04),M.tailOff);tb.position.set(0,0.84,-2.27);tb.visible=false;g.add(tb);g.userData.bar=tb;g.userData.tail=tb;
        toast('高精細な車モデルを読み込みました');
      }catch(e){}
    },undefined,()=>{});
  }catch(e){}
}
$('bday').onclick=()=>startGame(false);
$('bnight').onclick=()=>startGame(true);
$('bcourse').onclick=()=>{running=false;player.v=0;$('start').style.display='flex';};

const wrapD=d=>{if(d>L/2)d-=L;else if(d<-L/2)d+=L;return d;};
const sA={p:new V3(),t:new V3(),r:new V3(),k:0};
const rainVel=new V3(),dir=new V3(),tgt=new V3(),camPos=new V3(),camLook=new V3(),camLookCur=new V3(),fv=new V3(),rv=new V3();
function placeCar(mesh,s,x,yaw){sampleAt(s,sA);mesh.position.copy(sA.p).addScaledVector(sA.r,x);
  dir.copy(sA.t).multiplyScalar(Math.cos(yaw)).addScaledVector(sA.r,Math.sin(yaw));tgt.copy(mesh.position).add(dir);mesh.lookAt(tgt);return sA;}

function update(dt){
  const pl=player;
  if(running){
    const si=(keys.right?1:0)-(keys.left?1:0);
    pl.steer+=(si-pl.steer)*Math.min(1,dt*7);
    if(keys.up)pl.v+=(pl.v<20?8.5:pl.v<35?5.5:pl.v<50?3.4:1.8)*dt;
    if(keys.down)pl.v-=17*dt;
    pl.v-=(0.0006*pl.v*pl.v+0.35)*dt*(keys.up?0.4:1);
    pl.v=clamp(pl.v,0,72);
  }else{pl.steer=0;pl.v=Math.max(0,pl.v-20*dt);}
  sampleAt(pl.s,smp);
  const sf=Math.min(1,pl.v/10);
  const lat=pl.steer*7.5*sf+pl.v*pl.v*smp.k*0.55;
  pl.x+=lat*dt;pl.lat=lat;
  const lim=HW-1.05;
  if(Math.abs(pl.x)>lim){pl.x=Math.sign(pl.x)*lim;if(pl.v>6){pl.v*=Math.exp(-dt*1.6);shake=Math.max(shake,0.12);}}
  pl.s+=pl.v*dt;pl.dist+=pl.v*dt;pl.s=((pl.s%L)+L)%L;

  const nl=LANES.length;
  for(const c of cars){
    let lead=1e9,leadV=c.vt;
    for(const o of cars){if(o===c)continue;const d=wrapD(o.s-c.s);if(d>0&&d<lead&&Math.abs(o.x-c.x)<1.7){lead=d;leadV=o.v;}}
    const dp=wrapD(pl.s-c.s);if(dp>0&&dp<lead&&Math.abs(pl.x-c.x)<1.9){lead=dp;leadV=pl.v;}
    let want=c.vt;if(lead<38)want=Math.min(c.vt,leadV*(lead<15?0.8:1));
    const dv=clamp(want-c.v,-7*dt,2.2*dt);c.brake=dv<-1.2*dt;c.v=Math.max(0,c.v+dv);
    if(lead<32&&leadV<c.vt-3&&Math.random()<dt*0.6){
      const opts=[c.lane-1,c.lane+1].filter(l=>l>=0&&l<nl);const nln=opts[Math.random()*opts.length|0];const nx=LANES[nln];
      let free=Math.abs(wrapD(pl.s-c.s))>14||Math.abs(pl.x-nx)>2;
      for(const o of cars){if(o!==c&&Math.abs(wrapD(o.s-c.s))<16&&(Math.abs(o.x-nx)<1.8||Math.abs(o.lx-nx)<0.1)){free=false;break;}}
      if(free){c.lane=nln;c.lx=nx;}}
    const dx=c.lx-c.x;c.x+=clamp(dx,-1.6*dt,1.6*dt);
    c.s=((c.s+c.v*dt)%L+L)%L;
    c.yaw=clamp((Math.abs(dx)>0.02?Math.sign(dx)*1.6:0)/Math.max(c.v,5),-0.2,0.2);
  }
  for(const c of cars){
    const ds=wrapD(c.s-pl.s),dx=c.x-pl.x,need=(c.len+4.45)/2;
    if(Math.abs(ds)<need&&Math.abs(dx)<1.95){
      if(Math.abs(dx)>1.45&&Math.abs(ds)<need-0.8){pl.x=c.x-Math.sign(dx)*1.95;shake=Math.max(shake,0.2);continue;}
      if(ds>0){const push=need-ds;pl.s=((pl.s-push)%L+L)%L;pl.dist-=push;if(pl.v>c.v){if(pl.v-c.v>3){bumpSound();shake=Math.min(1,0.15+(pl.v-c.v)*0.03);}pl.v=c.v*0.85;}}
      else{c.s=((c.s-(need+ds))%L+L)%L;c.v=Math.min(c.v,pl.v*0.9);}
    }
  }
  if(running){const ln=Math.floor(pl.dist/L);if(ln>lapNo){lapNo=ln;const lt=clock-lapStart;lapStart=clock;
    let msg='LAP '+fmt(lt);if(best===null||lt<best){best=lt;msg+='<br><span style="font-size:15px;color:#ffd84a">ベストラップ更新！</span>';try{localStorage.setItem('shutoko_best2_'+CFG.key,String(best));}catch(e){}}toast(msg);}}
  if(night!==nightTarget){night+=Math.sign(nightTarget-night)*dt*0.4;if(Math.abs(night-nightTarget)<0.01)night=nightTarget;applyLight(night);}
  if(wet!==wetTarget){wet+=Math.sign(wetTarget-wet)*dt*0.3;if(Math.abs(wet-wetTarget)<0.01)wet=wetTarget;applyLight(night);}
  waterNorm.offset.x+=dt*0.004;waterNorm.offset.y+=dt*0.0025;
  animHooks.forEach(f=>f(dt,clock,nightE));
  if(aviation)aviation.material.opacity=Math.max(0.25,nightE)*(Math.sin(clock*2.2)>0.2?1:0.1);
}

function place(dt){
  const pl=player;
  const yaw=clamp(Math.atan2(pl.lat,Math.max(pl.v,4))*0.8,-0.45,0.45);
  const s=placeCar(pl.mesh,pl.s,pl.x,yaw);
  const pt=s.t.clone(),pdir=dir.clone(),pr=s.r.clone();
  pl.wheels.forEach(w=>{w.rotation.order='YXZ';w.rotation.x+=pl.v*dt/0.34;if(w.userData.front)w.rotation.y=-pl.steer*0.35;});
  if(pl.heroWheels)pl.heroWheels.forEach(w=>{w.rotation.x-=pl.v*dt/0.34;});
  pl.mesh.userData.tail.material=pl.mesh.userData.bar.material=keys.down&&running?M.tailOn:M.tailOff;
  beam.position.copy(pl.mesh.position);beam.position.y+=0.06;tgt.copy(beam.position).add(pdir);beam.lookAt(tgt);
  spot.position.copy(pl.mesh.position).addScaledVector(pdir,2.1);spot.position.y+=0.75;spot.target.position.copy(pl.mesh.position).addScaledVector(pdir,30);
  let ti=0;
  const addTail=(mesh,len,vis)=>{if(!vis){for(let q=0;q<6;q++)tailArr[ti++]=q%3===1?-9999:0;return;}
    const p=mesh.position;fv.set(0,0,1).applyQuaternion(mesh.quaternion);rv.set(1,0,0).applyQuaternion(mesh.quaternion);
    for(const o of [-0.62,0.62]){tailArr[ti++]=p.x-fv.x*len/2+rv.x*o;tailArr[ti++]=p.y+0.82;tailArr[ti++]=p.z-fv.z*len/2+rv.z*o;}};
  addTail(pl.mesh,4.45,true);
  for(const c of cars){const vis=Math.abs(wrapD(c.s-pl.s))<850;c.mesh.visible=vis;if(vis){placeCar(c.mesh,c.s,c.x,c.yaw||0);c.mesh.userData.tail.material=c.brake?M.tailOn:M.tailOff;}addTail(c.mesh,c.len,vis);}
  tailGlow.geometry.attributes.position.needsUpdate=true;

  /* lamp lights near player */
  if(quality===2&&nightE>0.02&&lightSlots.length){
    let lo=0,hi=lightSlots.length-1;const target=pl.s+6;while(lo<hi){const m=(lo+hi)>>1;if(lightSlots[m].s<target)lo=m+1;else hi=m;}
    for(let k=0;k<4;k++){const sl=lightSlots[(lo+k)%lightSlots.length];lampLights[k].position.set(sl.x,sl.y,sl.z);lampLights[k].intensity=nightE*2.4;}
  }else lampLights.forEach(l=>l.intensity=0);
  if(inTunnelS(pl.s)&&quality===2){let lo=0,hi=lightSlots.length-1;const target=pl.s;while(lo<hi){const m=(lo+hi)>>1;if(lightSlots[m].s<target)lo=m+1;else hi=m;}
    for(let k=0;k<4;k++){const sl=lightSlots[(lo+k)%lightSlots.length];lampLights[k].position.set(sl.x,sl.y,sl.z);lampLights[k].intensity=2.0;}}

  /* sun follows player for shadows */
  sun.position.copy(pl.mesh.position).addScaledVector(sunDir,600);sun.target.position.copy(pl.mesh.position);
  skyGroup.position.copy(camera.position);rainVel.copy(pdir).multiplyScalar(pl.v);updateRain(dt,camera.position,rainVel);moon.position.set(SUN_D[2].x*2300,SUN_D[2].y*2300,SUN_D[2].z*2300);

  const cp=pl.mesh.position;
  if(camMode===0){camPos.copy(cp).addScaledVector(pt,-6.3);camPos.y+=1.85;camLook.copy(cp).addScaledVector(pt,3.5);camLook.y+=1.05;}
  else if(camMode===1){camPos.copy(cp).addScaledVector(pt,-13);camPos.y+=4.6;camLook.copy(cp).addScaledVector(pt,8);camLook.y+=0.6;}
  else{camPos.copy(cp).addScaledVector(pdir,-0.2);camPos.y+=1.05;camLook.copy(cp).addScaledVector(pdir,25);camLook.y+=0.85;}
  if(!camInit){camera.position.copy(camPos);camLookCur.copy(camLook);camInit=true;}
  const smooth=camMode<2;
  camera.position.lerp(camPos,smooth?1-Math.exp(-dt*9):1);camLookCur.lerp(camLook,smooth?1-Math.exp(-dt*12):1);
  if(shake>0){camera.position.x+=(Math.random()-0.5)*shake;camera.position.y+=(Math.random()-0.5)*shake;shake=Math.max(0,shake-dt*1.5);}
  camera.lookAt(camLookCur);
  if(camMode<2)camera.rotateZ(-pl.steer*0.012*Math.min(1,pl.v/30));
  const fov=57+clamp(pl.v/72,0,1)*14;if(Math.abs(camera.fov-fov)>0.05){camera.fov=fov;camera.updateProjectionMatrix();}

  /* HUD */
  $('spd').firstChild.nodeValue=Math.round(pl.v*3.6);
  let g=1;while(g<GEARS.length-1&&pl.v>GEARS[g])g++;
  $('gear').textContent=pl.v<0.3?'N':g;
  const lo=GEARS[g-1],hi=GEARS[g];const rpm=pl.v<0.3?850:900+clamp((pl.v-lo)/(hi-lo),0,1)*6200;
  $('revb').style.width=(rpm/7200*100).toFixed(1)+'%';
  const si=idxOfS(pl.s);
  const an=CFG.pts[AREA_I[si]][3]||'';
  const areaTxt=TMASK[si]?(an.indexOf('トンネル')>=0?an:an+'　トンネル'):(CUT[si]?an+'　掘割':an);
  if($('area').textContent!==areaTxt)$('area').textContent=areaTxt;
  const rt=CFG.dirs[DIR_I[si]][1];if($('route').textContent!==rt)$('route').textContent=rt;
  $('lap').textContent='LAP '+(running?fmt(clock-lapStart):'0:00.0')+'　BEST '+(best?fmt(best):'--:--.-');
  if(eng&&ac){const fr=rpm/60*2,t=ac.currentTime,tun=TMASK[si]?1.6:1;
    eng.o1.frequency.setTargetAtTime(fr,t,0.04);eng.o2.frequency.setTargetAtTime(fr/2,t,0.04);
    eng.f.frequency.setTargetAtTime(400+rpm*0.12+(keys.up?300:0),t,0.05);
    eng.g.gain.setTargetAtTime(muted||!running?0:(0.045+(keys.up?0.03:0))*tun,t,0.08);
    eng.ng.gain.setTargetAtTime(muted||!running?(muted?0:wet*0.03):clamp(pl.v/70,0,1)*0.05*tun+wet*0.035,t,0.1);eng.nf.frequency.setTargetAtTime(300+pl.v*15,t,0.1);}
}

function onResize(){renderer.setSize(viewW(),viewH(),false);camera.aspect=viewW()/viewH();camera.updateProjectionMatrix();try{if(postOK)setupPost();}catch(e){postFallback();}}
addEventListener('resize',onResize);addEventListener('orientationchange',()=>setTimeout(onResize,300));if(window.visualViewport)visualViewport.addEventListener('resize',onResize);
document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else ac.resume();});

/* =========================================================
   Boot
   ========================================================= */
document.querySelectorAll('.course').forEach(x=>x.classList.toggle('sel',x.dataset.c===selCourse));
applyQuality();
buildCourse(selCourse);
applyLight(0);
loadHeroCar();
let last=performance.now(),frame=0;
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;clock+=dt;
  update(dt);place(dt);
  if((frame++%3)===0)drawMap();
  skyU.time.value=clock;finalMat.uniforms.time.value=clock;
  renderFrame();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
