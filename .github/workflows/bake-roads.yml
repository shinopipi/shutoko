name: 道路データを作成
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools/bake_roads.py
      - .github/workflows/bake-roads.yml
concurrency:
  group: bake-roads
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: osmium を用意
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: 取得（途中保存しながら）
        env:
          BAKE_MINUTES: '95'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/bake_roads.py
      - name: 未完了なら続きを予約
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f bake_more ]; then gh workflow run bake-roads.yml -R ${{ github.repository }}; fi
